name: Release

# 触发条件：
#   1) 推送 tag（如 v1.0.1）
#   2) 手动 workflow_dispatch
#   注：推送 main 不再直接触发本流程（避免每次 push 都跑发布）；
#       如需「commit message 含 release/publish 即发布」，可在 should-release
#       中结合 push 事件判断。当前保持 tag/手动触发，稳定可靠。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  should-release:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          TAG=""
          RELEASE="false"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            RELEASE="true"
          elif git log -1 --pretty=%B | grep -iE 'release|publish'; then
            TAG="v$(date +%Y%m%d-%H%M)"
            RELEASE="true"
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: should-release
    if: needs.should-release.outputs.release == 'true'
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Build amd64 (native, Qt6)
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake dpkg-dev debhelper extra-cmake-modules \
            qt6-base-dev qt6-base-dev-tools \
            libgl1-mesa-dev libegl1 libglu1-mesa-dev pkg-config
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DQT_VERSION_MAJOR=6
          cmake --build build -j"$(nproc)"
          # 打包为 deb
          dpkg-buildpackage -us -uc -b -aamd64
          mkdir -p dist
          cp ../convert-search-plugin_*_amd64.deb dist/
          dpkg-deb -x dist/convert-search-plugin_*_amd64.deb /tmp/ext_amd64
          find /tmp/ext_amd64 -name convert-search-plugin -type f \
            -exec cp {} dist/convert-search-plugin_amd64 \;

      - name: Build arm64 (docker, Qt6)
        if: matrix.arch == 'arm64'
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}":/src -w /src ubuntu:24.04 bash -c '
            set -e
            apt-get update
            apt-get install -y --no-install-recommends \
              cmake dpkg-dev debhelper extra-cmake-modules \
              qt6-base-dev qt6-base-dev-tools \
              libgl1-mesa-dev libegl1 libglu1-mesa-dev pkg-config build-essential
            sed -i "s/^Architecture: any/Architecture: arm64/" debian/control
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DQT_VERSION_MAJOR=6
            cmake --build build -j"$(nproc)"
            dpkg-buildpackage -us -uc -b -aarm64
            mkdir -p dist
            cp ../convert-search-plugin_*_arm64.deb dist/
            dpkg-deb -x dist/convert-search-plugin_*_arm64.deb /tmp/ext_arm64
            find /tmp/ext_arm64 -name convert-search-plugin -type f \
              -exec cp {} dist/convert-search-plugin_arm64 \;
            '

      - name: Checksum
        run: |
          cd dist
          sha256sum *.deb convert-search-plugin_* > "SHA256SUMS_${{ matrix.arch }}.txt"
          cat "SHA256SUMS_${{ matrix.arch }}.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [should-release, build]
    if: needs.should-release.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          PREV="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          {
            echo "## 变更 ($(date +%Y-%m-%d))"
            echo
            if [[ -z "$PREV" ]]; then
              git log --pretty=format:"- %s (%h)"
            else
              git log "${PREV}..HEAD" --pretty=format:"- %s (%h)"
            fi
            echo
            echo
            echo "## 文件校验 (SHA256)"
            echo
            cat all-dist/SHA256SUMS_*.txt 2>/dev/null || true
          } > all-dist/CHANGELOG.md
          cat all-dist/CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.should-release.outputs.tag }}
          name: ${{ needs.should-release.outputs.tag }}
          body_path: all-dist/CHANGELOG.md
          files: |
            all-dist/*.deb
            all-dist/convert-search-plugin_*
            all-dist/SHA256SUMS_*.txt
          fail_on_unmatched_files: false
