name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            pkg_arch: amd64
          - arch: arm64
            pkg_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 多架构：用 QEMU + 容器构建 arm64（GitHub 托管 runner 为 x86_64）
      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Build on amd64 (native)
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake extra-cmake-modules qtbase5-dev \
            libqt6core6 libqt6dbus6 qt6-base-dev \
            qdbus-qt6 pkg-config
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ./build/convert-search-plugin --version || true

      - name: Build on arm64 (via docker)
        if: matrix.arch == 'arm64'
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}":/src -w /src \
            ubuntu:24.04 bash -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                cmake extra-cmake-modules qtbase5-dev \
                libqt6core6 libqt6dbus6 qt6-base-dev \
                qdbus-qt6 pkg-config
              cmake -B build -DCMAKE_BUILD_TYPE=Release
              cmake --build build -j"$(nproc)"
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: convert-search-plugin-${{ matrix.arch }}
          path: build/convert-search-plugin
